<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | BankingPoint24 - Rutva Multiservices LLP</title>
  <meta name="description" content="Register as a BankingPoint24 partner. Operated by Rutva Multiservices LLP.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/logo/3.png">
  <link rel="shortcut icon" href="images/logo/3.png" type="image/png">
  <link rel="apple-touch-icon" href="images/logo/3.png">
</head>

<body class="bg-light-subtle-custom min-vh-100 d-flex flex-column justify-content-between">

  <!-- NAVBAR -->
  <div id="navbar-placeholder"></div>

  <!-- SIGNUP CARD CONTAINER -->
  <main class="py-5 my-auto">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
          <div class="card-custom bg-white p-4 p-md-5 border-0 shadow-lg">
            <div class="text-center mb-4">
              <div class="logo-icon-box mx-auto mb-3" style="width:56px; height:56px; font-size:1.6rem;">
                <i class="bi bi-person-plus-fill"></i>
              </div>
              <h3 class="fw-extrabold text-navy">Join BankingPoint24</h3>
              <p class="text-muted fs-7">Create your partner account to access digital services</p>
            </div>

            <form id="signupForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fs-7 font-bold text-navy">Full Name *</label>
                  <input type="text" class="form-control form-control-custom" placeholder="Your full name" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label fs-7 font-bold text-navy">Mobile Number *</label>
                  <input type="tel" class="form-control form-control-custom" placeholder="10-digit mobile number"
                    required>
                </div>

                <div class="col-md-6">
                  <label class="form-label fs-7 font-bold text-navy">Email Address *</label>
                  <input type="email" class="form-control form-control-custom" placeholder="name@example.com" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label fs-7 font-bold text-navy">City / Location *</label>
                  <input type="text" class="form-control form-control-custom" placeholder="City name" required>
                </div>

                <div class="col-12">
                  <label class="form-label fs-7 font-bold text-navy">Business / Shop Name</label>
                  <input type="text" class="form-control form-control-custom"
                    placeholder="Name of your retail store or agency">
                </div>

                <div class="col-md-6">
                  <label class="form-label fs-7 font-bold text-navy">Password *</label>
                  <input type="password" class="form-control form-control-custom" placeholder="Create password"
                    required>
                </div>

                <div class="col-md-6">
                  <label class="form-label fs-7 font-bold text-navy">Confirm Password *</label>
                  <input type="password" class="form-control form-control-custom" placeholder="Re-enter password"
                    required>
                </div>

                <div class="col-12">
                  <label class="form-label fs-7 font-bold text-navy">Service Interest</label>
                  <select class="form-select form-select-custom">
                    <option value="POS Services">POS Services</option>
                    <option value="QR Code Services">QR Code Services</option>
                    <!-- Temporarily Disabled Options
                    <option value="Travel Services">Travel Services</option>
                    <option value="Insurance Services">Insurance Services</option>
                    <option value="Grocery Services">Grocery Services</option>
                    <option value="Education Services">Education Services</option>
                    <option value="Products & Services">Products &amp; Services</option>
                    -->
                    <option value="All Services" selected>All Digital Services</option>
                  </select>
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="acceptTerms" required>
                    <label class="form-check-label fs-7 text-muted" for="acceptTerms">
                      I accept the <a href="terms.html" class="text-blue" target="_blank">Terms &amp; Conditions</a> and
                      <a href="privacy-policy.html" class="text-blue" target="_blank">Privacy Policy</a>.
                    </label>
                  </div>
                </div>

                <div class="col-12">
                  <button type="submit" class="btn btn-primary-custom w-100 justify-content-center">
                    Create Account <i class="bi bi-arrow-right ms-1"></i>
                  </button>
                </div>
              </div>
            </form>

            <div id="signupAlert" class="d-none"></div>

            <div class="text-center pt-3 border-top mt-3">
              <p class="fs-7 text-muted mb-0">
                Already have an account? <a href="login.html" class="text-blue font-bold">Login Here</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
