<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BankingPoint24 - Rutva Multiservices LLP</title>
  <meta name="description" content="Login to your BankingPoint24 partner account. Operated by Rutva Multiservices LLP.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/logo/3.png">
  <link rel="shortcut icon" href="images/logo/3.png" type="image/png">
  <link rel="apple-touch-icon" href="images/logo/3.png">
</head>
<body class="bg-light-subtle-custom min-vh-100 d-flex flex-column justify-content-between">

  <!-- NAVBAR -->
  <div id="navbar-placeholder"></div>

  <!-- LOGIN CARD CONTAINER -->
  <main class="py-5 my-auto">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card-custom bg-white p-4 p-md-5 border-0 shadow-lg">
            <div class="text-center mb-4">
              <div class="logo-icon-box mx-auto mb-3" style="width:56px; height:56px; font-size:1.6rem;">
                <i class="bi bi-person-lock"></i>
              </div>
              <h3 class="fw-extrabold text-navy">Welcome Back</h3>
              <p class="text-muted fs-7">Login to your BankingPoint24 Portal</p>
            </div>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fs-7 font-bold text-navy">Mobile Number or Email *</label>
                <input type="text" class="form-control form-control-custom" placeholder="Enter mobile or email" required>
              </div>

              <div class="mb-3">
                <label class="form-label fs-7 font-bold text-navy">Password *</label>
                <input type="password" class="form-control form-control-custom" placeholder="••••••••" required>
              </div>

              <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label fs-7 text-muted" for="rememberMe">Remember Me</label>
                </div>
                <a href="#" class="fs-7 text-blue text-decoration-none" onclick="alert('Password reset is available via support. Please contact support on WhatsApp.'); return false;">Forgot Password?</a>
              </div>

              <button type="submit" class="btn btn-primary-custom w-100 justify-content-center mb-3">
                Login <i class="bi bi-box-arrow-in-right ms-1"></i>
              </button>
            </form>

            <div id="loginAlert" class="d-none"></div>

            <div class="text-center pt-3 border-top mt-3">
              <p class="fs-7 text-muted mb-0">
                Don't have an account? <a href="signup.html" class="text-blue font-bold">Create New Account</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
